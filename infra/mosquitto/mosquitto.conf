# Mosquitto MQTT Broker Configuration — SMART RH 4.0
# TLS/SSL enabled with per-device authentication
# Production-ready security configuration

# ============================================================
# Default MQTT Listener (Unencrypted - Testing Only)
# ============================================================
listener 1883
protocol mqtt
allow_anonymous false

# ============================================================
# TLS/SSL Listener (Port 8883 - PRODUCTION)
# ============================================================
# Commented out for testing - requires certificates to be generated
# Uncomment after running: bash infra/mosquitto/generate-mqtt-certs.sh
# listener 8883
# protocol mqtt
#
# # Certificate files (mounted from Docker secrets or volumes)
# certfile /etc/mosquitto/certs/server.crt
# keyfile /etc/mosquitto/certs/server.key
# cafile /etc/mosquitto/certs/ca.crt
#
# # TLS version enforcement (1.2 or higher for security)
# tls_version tlsv1.2
#
# # Optional: Require client certificate verification (mTLS)
# require_certificate false

# ============================================================
# WebSocket Listener (Optional - for Angular frontend)
# ============================================================
# listener 9001
# protocol websockets
# cafile /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile /etc/mosquitto/certs/server.key

# ============================================================
# Authentication Configuration
# ============================================================
# Password file for username/password authentication
password_file /etc/mosquitto/passwd

# Require authentication for all connections
allow_anonymous false

# ============================================================
# Access Control Lists (ACL)
# ============================================================
# ACL file for topic-level permissions
acl_file /etc/mosquitto/acl

# Deny access if no matching ACL rule found
# (default behavior: deny if ACL specified)

# ============================================================
# Persistence Configuration
# ============================================================
# Enable message persistence (survives broker restart)
persistence true
persistence_location /mosquitto/data/

# Persistence database filename
persistence_file mosquitto.db

# Save DB every N messages (default 20)
autosave_interval 1000

# ============================================================
# Message Queue & Memory Management
# ============================================================
# Queue messages for disconnected clients (QoS 1+)
max_queued_messages 100

# ============================================================
# Client Connection Configuration
# ============================================================
# Maximum concurrent client connections
max_connections -1

# ============================================================
# Logging Configuration
# ============================================================
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Include timestamp in logs
log_timestamp true

# ============================================================
# Security Hardening
# ============================================================
# Disable system info in SYS_TREE topic
sys_interval 0

# Max in-flight messages (per client)
max_inflight_messages 20

# ============================================================
# Device Configuration Notes
# ============================================================
# Each IoT device authenticates with:
#   - Username: device_{DEVICE_ID} (e.g., device_camera_01)
#   - Password: bcrypt hashed credentials (stored in /etc/mosquitto/passwd)
#   - Topic: smartrh/devices/{DEVICE_ID}/{type}/{reading}
#     Examples:
#       smartrh/devices/camera_01/face/detection
#       smartrh/devices/motion_01/motion/detected
#       smartrh/devices/lock_01/door/lock_status
#       smartrh/devices/camera_01/health/heartbeat
#
# ACL Rules (in /etc/mosquitto/acl):
#   Each device can only PUBLISH to its own topic prefix
#   Backend server can SUBSCRIBE to all device topics
#