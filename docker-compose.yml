version: "3.9"

# ══════════════════════════════════════════════════════════════════════════════
# SMART RH 4.0 — Docker Compose
# Services: MySQL · Backend (Spring Boot) · (Frontend + AI service come later)
#
# Usage:
#   Quick start (MySQL + backend):
#     docker compose up --build
#
#   Individual service:
#     docker compose up mysql          # database only
#     docker compose up --build backend
#
#   Reset volumes:
#     docker compose down -v
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── MySQL 8 ───────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: smart-rh-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE:      ${DB_NAME:-smart_rh_db}
      MYSQL_USER:          ${DB_USER:-smart_rh}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-smart_rh_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smart-rh-net

  # ── Spring Boot Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-rh-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST:     mysql
      DB_PORT:     3306
      DB_NAME:     ${DB_NAME:-smart_rh_db}
      DB_USER:     ${DB_USER:-smart_rh}
      DB_PASSWORD: ${DB_PASSWORD:-smart_rh_pass}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-c21hcnQtcmgtNDAta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==}
      # ── MQTT Configuration ────────────────────────────────────────────────────
      APP_MQTT_ENABLED:             ${MQTT_ENABLED:-true}
      APP_MQTT_BROKER_URL:          ${MQTT_BROKER_URL:-ssl://mqtt:8883}
      APP_MQTT_CLIENT_ID:           ${MQTT_CLIENT_ID:-smart-rh-backend}
      APP_MQTT_USERNAME:            ${MQTT_USERNAME:-backend_admin}
      APP_MQTT_PASSWORD:            ${MQTT_PASSWORD:-}
      APP_MQTT_USE_TLS:             ${MQTT_USE_TLS:-true}
      APP_MQTT_FORWARD_RECOGNITION: ${MQTT_FORWARD_RECOGNITION:-true}
    volumes:
      - uploads:/app/uploads
    networks:
      - smart-rh-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Eclipse Mosquitto MQTT Broker (IoT integration) ───────────────────────
  # Production-ready MQTT broker with TLS/SSL and per-device authentication
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: smart-rh-mqtt
    restart: unless-stopped
    ports:
      # MQTT unencrypted (development only - comment out in production)
      - "1883:1883"
      # MQTT with TLS/SSL (production)
      - "8883:8883"
      # WebSocket (optional)
      - "9001:9001"
    volumes:
      # Configuration file
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # TLS/SSL certificates (must be generated with generate-mqtt-certs.sh)
      - ./infra/mosquitto/certs:/etc/mosquitto/certs:ro
      # Device credentials (username/password file)
      - ./infra/mosquitto/passwd:/etc/mosquitto/passwd:ro
      # Access Control Lists (topic permissions)
      - ./infra/mosquitto/acl:/etc/mosquitto/acl:ro
      # Data persistence
      - mqtt-data:/mosquitto/data
      # Log persistence
      - mqtt-log:/mosquitto/log
    environment:
      # Optional: Additional configuration via env vars
      TZ: "Africa/Casablanca"
    networks:
      - smart-rh-net
    healthcheck:
      # Check if MQTT is listening on port 1883
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1883", "-u", "backend_admin", "-P", "testing", "-t", "$SYS/broker/info", "-W", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "com.example.description=MQTT Broker for IoT device integration"
      - "com.example.version=2.0"

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  mysql-data:
  uploads:
  mqtt-data:
  mqtt-log:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  smart-rh-net:
    driver: bridge
