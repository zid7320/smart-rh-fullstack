spring.application.name=smart-rh

# ──────────────────────────────────────────────────────────────────────────────
# Server
# ──────────────────────────────────────────────────────────────────────────────
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ──────────────────────────────────────────────────────────────────────────────
# DataSource — H2 in-memory (temporary until MySQL integration)
# Switch to profile "mysql" for production: -Dspring.profiles.active=mysql
# ──────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:smartrhdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ──────────────────────────────────────────────────────────────────────────────
# JPA / Hibernate
# ──────────────────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ──────────────────────────────────────────────────────────────────────────────
# H2 Console  (dev only — set false via env override in prod)
# ──────────────────────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ──────────────────────────────────────────────────────────────────────────────
# Flyway — disabled in H2 profile; enabled in mysql profile
# ──────────────────────────────────────────────────────────────────────────────
spring.flyway.enabled=false

# ──────────────────────────────────────────────────────────────────────────────
# OpenAPI / Swagger UI
# http://localhost:8080/swagger-ui/index.html
# ──────────────────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ──────────────────────────────────────────────────────────────────────────────
# JWT
# ──────────────────────────────────────────────────────────────────────────────
app.jwt.secret=c21hcnQtcmgtNDAta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ──────────────────────────────────────────────────────────────────────────────
# File Storage (payroll PDFs, face images)
# ──────────────────────────────────────────────────────────────────────────────
app.storage.root=./uploads

# ──────────────────────────────────────────────────────────────────────────────
# Actuator
# ──────────────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ──────────────────────────────────────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────────────────────────────────────
logging.level.com.smart.rh=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ──────────────────────────────────────────────────────────────────────────────
# MQTT — HiveMQ Cloud Integration
# Set app.mqtt.enabled=true (or env APP_MQTT_ENABLED=true) to activate.
# When enabled=false, all MQTT beans are skipped (broker not needed for dev).
# ──────────────────────────────────────────────────────────────────────────────
app.mqtt.enabled=${APP_MQTT_ENABLED:true}
app.mqtt.broker-url=${APP_MQTT_BROKER_URL:ssl://eb62037ac5254d2784d2c1078b1cb5ac.s1.eu.hivemq.cloud:8883}
app.mqtt.client-id=${APP_MQTT_CLIENT_ID:smart-rh-backend}
app.mqtt.username=${APP_MQTT_USERNAME:smart-rh-backend}
app.mqtt.password=${APP_MQTT_PASSWORD:SmartRH@2025!}
app.mqtt.use-tls=${APP_MQTT_USE_TLS:true}
# Topics subscribed at startup (comma-separated)
# For IoT device management: smartrh/devices/+/+/+ (dynamic device topics)
# For legacy attendance: smartrh/attendance/recognition, smartrh/attendance/raw
# For system: smartrh/system/heartbeat
app.mqtt.topics=${APP_MQTT_TOPICS:smartrh/devices/+/+/+,smartrh/attendance/recognition,smartrh/attendance/raw,smartrh/system/heartbeat}
app.mqtt.qos=${APP_MQTT_QOS:1}
app.mqtt.completion-timeout=${APP_MQTT_COMPLETION_TIMEOUT:5000}
# Forward deserialized recognition events to AttendanceService (and WebSocket broadcast)
app.mqtt.forward-recognition=${APP_MQTT_FORWARD_RECOGNITION:true}
