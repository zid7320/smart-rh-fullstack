# ──────────────────────────────────────────────────────────────────────────────
# MySQL Profile — activate with: -Dspring.profiles.active=mysql
# In Docker: SPRING_PROFILES_ACTIVE=mysql
# ──────────────────────────────────────────────────────────────────────────────

# DataSource
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_rh_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:smart_rh}
spring.datasource.password=${DB_PASSWORD:smart_rh_pass}

# Hibernate — Flyway owns ALL schema changes; Hibernate must NOT touch the DDL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console disabled in MySQL profile
spring.h2.console.enabled=false

# Flyway enabled
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
