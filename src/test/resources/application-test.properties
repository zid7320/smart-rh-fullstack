# ──────────────────────────────────────────────────────────────────────────────
# Test profile — H2 in-memory, no Flyway, no real MQTT broker needed
# ──────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

# Disable MQTT subscriber — no broker required in tests
app.mqtt.enabled=false

logging.level.com.smart.rh=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
