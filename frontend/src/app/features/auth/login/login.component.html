<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>SMART RH 4.0</mat-card-title>
      <mat-card-subtitle>Connexion à votre espace</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nom d'utilisateur ou e-mail</mat-label>
          <input matInput formControlName="usernameOrEmail" autocomplete="username" />
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mot de passe</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="hidePassword = !hidePassword"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        @if (error) {
          <p class="error-msg">{{ error }}</p>
        }

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width"
          [disabled]="form.invalid || loading"
        >
          @if (loading) {
            <mat-spinner diameter="20" />
          } @else {
            Se connecter
          }
        </button>
      </form>

      <p class="register-link">
        Pas encore de compte ? <a routerLink="/register">S'inscrire</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
