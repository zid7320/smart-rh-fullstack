<div class="page-header">
  <h2 class="page-title">Postes</h2>
  <button mat-raised-button color="primary" (click)="openForm()">
    <mat-icon>add</mat-icon> Ajouter
  </button>
</div>

<mat-card>
  <mat-card-content>
    @if (loading) { <mat-progress-bar mode="indeterminate"></mat-progress-bar> }

    <div class="table-wrapper">
      <table mat-table [dataSource]="dataSource" class="full-table">

        <ng-container matColumnDef="titre">
          <th mat-header-cell *matHeaderCellDef>Titre</th>
          <td mat-cell *matCellDef="let p"><strong>{{ p.titre }}</strong></td>
        </ng-container>

        <ng-container matColumnDef="competencesRequises">
          <th mat-header-cell *matHeaderCellDef>Description requise</th>
          <td mat-cell *matCellDef="let p" class="desc-cell">{{ p.competencesRequises ?? '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="competenceNoms">
          <th mat-header-cell *matHeaderCellDef>Compétences liées</th>
          <td mat-cell *matCellDef="let p">
            <mat-chip-set>
              @for (nom of (p.competenceNoms ?? []); track nom) {
                <mat-chip>{{ nom }}</mat-chip>
              }
              @if (!(p.competenceNoms?.length)) {
                <span class="none">—</span>
              }
            </mat-chip-set>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let p" class="actions-cell">
            <button mat-icon-button (click)="manageCompetences(p)" matTooltip="Gérer les compétences">
              <mat-icon>link</mat-icon>
            </button>
            <button mat-icon-button (click)="openForm(p)" matTooltip="Modifier">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="delete(p)" matTooltip="Supprimer">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">Aucun poste.</td>
        </tr>
      </table>
    </div>

    <mat-paginator
      [length]="totalElements" [pageSize]="pageSize"
      [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons>
    </mat-paginator>
  </mat-card-content>
</mat-card>
