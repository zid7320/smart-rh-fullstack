<div class="page-header">
  <div>
    <h2 class="page-title">Paie</h2>
    <p class="page-subtitle">Historique des bulletins et génération mensuelle de paie.</p>
  </div>
  @if (isRhAdmin) {
    <button mat-raised-button color="primary" (click)="openGenerate()">
      <mat-icon>payments</mat-icon> Générer la paie
    </button>
  }
</div>

<mat-card>
  <mat-card-content>
    <div class="toolbar-row">
      <span class="counter-chip">{{ totalElements }} bulletin(s)</span>
    </div>

    @if (loading) { <mat-progress-bar mode="indeterminate"></mat-progress-bar> }

    <div class="table-wrapper">
      <table mat-table [dataSource]="dataSource" matSort class="full-table">

        <ng-container matColumnDef="employeNomComplet">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Employé</th>
          <td mat-cell *matCellDef="let p">{{ p.employeNomComplet ?? '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="periode">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Période</th>
          <td mat-cell *matCellDef="let p">{{ moisLabel(p.mois) }} {{ p.annee }}</td>
        </ng-container>

        <ng-container matColumnDef="montant">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Montant</th>
          <td mat-cell *matCellDef="let p" class="amount">
            {{ p.montant | number:'1.2-2' }} €
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let p" class="actions-cell">
            <button mat-icon-button
                    (click)="downloadPdf(p)"
                    [disabled]="isDownloading(p.id)"
                    matTooltip="Télécharger le bulletin PDF">
              @if (isDownloading(p.id)) { <mat-spinner diameter="18"></mat-spinner> }
              @else { <mat-icon>picture_as_pdf</mat-icon> }
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">Aucun bulletin.</td>
        </tr>
      </table>
    </div>

    <mat-paginator [length]="totalElements" [pageSize]="pageSize"
      [pageSizeOptions]="[10,20,50]" showFirstLastButtons></mat-paginator>
  </mat-card-content>
</mat-card>
