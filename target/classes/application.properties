spring.datasource.url=jdbc:h2:mem:hrmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# To use MySQL, replace the above with e.g.:
# spring.datasource.url=jdbc:mysql://localhost:3306/hrmsdb?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=secret
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

server.port=8080
